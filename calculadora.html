<main>
    <section class="tarjeta tarjeta-calculadora" aria-labelledby="titulo-conversor">
        <h1 id="titulo-conversor" class="sr-only">Calculadora</h1>

        <div class="calculadora-principal">
            <div class="calculadora-pantalla">
                <p id="calc-expresion" class="calc-expresion" aria-hidden="true"></p>
                <p id="calc-resultado" class="calc-resultado" contenteditable="true" spellcheck="false" inputmode="decimal" role="textbox" aria-label="Resultado de la calculadora, puedes escribir tu operación">0</p>
            </div>

            <div class="calculadora-teclado">
                <button type="button" class="tecla-calc tecla-funcion" data-accion="limpiar" aria-label="Borrar todo">AC</button>
                <button type="button" class="tecla-calc tecla-funcion" data-accion="borrar" aria-label="Borrar último carácter">⌫</button>
                <button type="button" class="tecla-calc tecla-funcion" data-accion="porcentaje" aria-label="Porcentaje">%</button>
                <button type="button" class="tecla-calc tecla-operador" data-operador="÷" aria-label="Dividir">÷</button>

                <button type="button" class="tecla-calc" data-numero="7">7</button>
                <button type="button" class="tecla-calc" data-numero="8">8</button>
                <button type="button" class="tecla-calc" data-numero="9">9</button>
                <button type="button" class="tecla-calc tecla-operador" data-operador="×" aria-label="Multiplicar">×</button>

                <button type="button" class="tecla-calc" data-numero="4">4</button>
                <button type="button" class="tecla-calc" data-numero="5">5</button>
                <button type="button" class="tecla-calc" data-numero="6">6</button>
                <button type="button" class="tecla-calc tecla-operador" data-operador="−" aria-label="Restar">−</button>

                <button type="button" class="tecla-calc" data-numero="1">1</button>
                <button type="button" class="tecla-calc" data-numero="2">2</button>
                <button type="button" class="tecla-calc" data-numero="3">3</button>
                <button type="button" class="tecla-calc tecla-operador" data-operador="+" aria-label="Sumar">+</button>

                <button type="button" class="tecla-calc tecla-funcion" data-accion="signo" aria-label="Cambiar signo">+/-</button>
                <button type="button" class="tecla-calc" data-numero="0">0</button>
                <button type="button" class="tecla-calc" data-numero="." aria-label="Punto decimal">.</button>
                <button type="button" class="tecla-calc tecla-igual" data-accion="igual" aria-label="Calcular resultado">=</button>
            </div>
        </div>

        <section class="historial" aria-labelledby="historial-titulo">
            <h2 id="historial-titulo" class="historial-titulo">Historial</h2>
            <ul id="historial-lista" class="historial-lista"></ul>
            <button type="button" class="boton-limpiar" id="limpiar-historial" aria-label="Limpiar historial">Limpiar</button>
        </section>
    </section>
