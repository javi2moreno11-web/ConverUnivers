<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convierte litros, mililitros, metros cúbicos, centímetros cúbicos y galones con precisión.">
    <title>ConvertUnivers | Conversor de Volumen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a class="logo" href="index.html">ConverUnivers</a>
        <p class="tagline">Herramienta de conversiones rápidas</p>
    </div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Mostrar menú" aria-controls="main-nav">

    <label for="nav-toggle" class="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <button type="button" class="theme-toggle" aria-label="Cambiar tema">🌙</button>

    <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="longitud.html">Longitud</a>
        <a href="peso.html">Peso</a>
        <a href="temperatura.html">Temperatura</a>
        <a href="monedas.html">Monedas</a>
        <a href="tiempo.html">Tiempo</a>
        <a href="zonashorarias.html">Zonas</a>
        <a href="almacenamiento.html">Almacenamiento</a>
        <a href="velocidad.html">Velocidad</a>
        <a href="area.html">Área</a>
        <a href="volumen.html">Volumen</a>
        <a href="presion.html">Presión</a>
        <a href="energia.html">Energía</a>
    </nav>
</header>

<main>
    <section class="tarjeta" aria-labelledby="titulo-conversor">

        <h1 id="titulo-conversor" class="sr-only">Conversor de volumen</h1>

        <label for="cantidad" class="campo-label">Cantidad</label>
        <input type="number" id="cantidad" value="1" inputmode="decimal" autocomplete="off">

        <label for="origen" class="campo-label">De</label>
        <select id="origen">
            <option>Litro</option>
            <option>Mililitro</option>
            <option>Centímetro cúbico</option>
            <option>Metro cúbico</option>
            <option>Galón (US)</option>
        </select>

        <label for="destino" class="campo-label">A</label>
        <select id="destino">
            <option>Litro</option>
            <option>Mililitro</option>
            <option>Centímetro cúbico</option>
            <option>Metro cúbico</option>
            <option>Galón (US)</option>
        </select>

        <h2 id="resultado" aria-live="polite"></h2>

        <section class="historial" aria-labelledby="historial-titulo">
            <h2 id="historial-titulo" class="historial-titulo">Historial</h2>
            <ul id="historial-lista" class="historial-lista"></ul>
            <button type="button" class="boton-limpiar" id="limpiar-historial" aria-label="Limpiar historial">
                Limpiar
            </button>
        </section>

    </section>
</main>

<footer class="site-footer">
    <p>© 2026 ConverUnivers · Conversor de unidades.</p>
</footer>

<script src="theme.js"></script>
<script src="volumen.js"></script>

</body>
</html>
